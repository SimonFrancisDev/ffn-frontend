      .nodeText { fill:#fff; font:700 16px Inter,Arial,sans-serif; text-anchor:middle; }
      .smallText { fill:#fff; font:700 13px Inter,Arial,sans-serif; text-anchor:middle; }
      .owner { fill:#1de9b6; stroke:#c9fff2; stroke-width:3; }
