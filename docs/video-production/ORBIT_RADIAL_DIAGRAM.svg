  <rect class="bg" width="1600" height="2200"/>
  <text class="title" x="800" y="70" text-anchor="middle">Fin Freedom Network Radial Orbit View</text>
  <text class="sub" x="800" y="108" text-anchor="middle">The orbit owner is at the center; positions expand outward by line</text>

