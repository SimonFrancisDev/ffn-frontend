<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200">
  <defs>
    <style>
      .bg { fill:#07111f; }
      .panel { fill:#0b1730; stroke:#294564; stroke-width:2; }
      .ring { fill:none; stroke:#345778; stroke-width:3; stroke-dasharray:8 8; }
      .ray { stroke:#294564; stroke-width:2; }
      .title { fill:#fff; font:700 42px Inter,Arial,sans-serif; }
      .heading { fill:#fff; font:700 32px Inter,Arial,sans-serif; }
